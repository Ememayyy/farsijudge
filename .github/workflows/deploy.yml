name: Deploy FarsiJudge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing Repository Variable: VITE_SUPABASE_URL"; exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing Repository Variable: VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Extract source
        run: tar -xzf farsijudge-source.tar.gz

      - name: Apply auth, branding, and admin setup
        run: |
          patch -p1 < farsijudge-ui-auth.patch
          sed -i 's/آزمون‌یار/فارسی جاج/g; s/سامانه آزمون آنلاین/سامانه برگزاری مسابقه آنلاین/g' farsijudge/index.html
          python3 scripts/patch_typescript.py
          mkdir -p farsijudge/scripts
          cp scripts/feature_patch.py farsijudge/scripts/feature_patch.py
          cp scripts/platform_patch_clean.py farsijudge/scripts/platform_patch_clean.py
          cp scripts/platform_patch_actions.py farsijudge/scripts/platform_patch_actions.py
          (cd farsijudge && python3 scripts/feature_patch.py && python3 scripts/platform_patch_clean.py && python3 scripts/platform_patch_actions.py)
          mkdir -p farsijudge/public farsijudge/supabase/migrations farsijudge/supabase/email-templates
          cat logo-part-*.b64 | base64 --decode > farsijudge/public/farsijudge-logo.webp
          cp README.md farsijudge/README.md
          cp supabase/promote-admin.sql farsijudge/supabase/promote-admin.sql
          cp supabase/auth-url-settings.md farsijudge/supabase/auth-url-settings.md
          cp supabase/migrations/002_teams_registration_admin_features.sql farsijudge/supabase/migrations/002_teams_registration_admin_features.sql
          cp supabase/migrations/003_farsijudge_platform_upgrade.sql farsijudge/supabase/migrations/003_farsijudge_platform_upgrade.sql
          cp supabase/migrations/004_profile_edit.sql farsijudge/supabase/migrations/004_profile_edit.sql
          cp supabase/email-templates/confirm-signup.html farsijudge/supabase/email-templates/confirm-signup.html

      - name: Assemble final frontend features
        run: |
          mkdir -p farsijudge/scripts
          python3 - <<'PY'
          from pathlib import Path
          root = Path("release-patch")
          a = (root / "app_00.txt").read_text(encoding="utf-8")
          b = (root / "app_01.txt").read_text(encoding="utf-8")
          assert len(a) == 4500, f"app_00 length: {len(a)}"
          assert len(b) >= 4500, f"app_01 length: {len(b)}"
          Path("farsijudge/scripts/finalize_app.py").write_text(a + b[:4500], encoding="utf-8")
          PY
          for part in release-patch/app_*.b64; do
            case "$part" in
              *app_06.b64|*app_08.b64) echo "Skipping replaced damaged $part"; continue ;;
            esac
            echo "Decoding $part"
            base64 -d "$part" >> farsijudge/scripts/finalize_app.py
          done
          : > farsijudge/scripts/final-visual.css
          for part in release-patch/style_*.b64; do
            case "$part" in *style_00.b64) echo "Skipping replaced damaged $part"; continue ;; esac
            echo "Decoding $part"
            base64 -d "$part" >> farsijudge/scripts/final-visual.css
          done
          (cd farsijudge && python3 scripts/finalize_app.py && cat scripts/final-visual.css >> src/style.css)

      - name: Upload patched source snapshot (verification)
        uses: actions/upload-artifact@v4
        with:
          name: farsijudge-source-snapshot
          path: |
            ./farsijudge/src/App.tsx
            ./farsijudge/src/style.css
            ./farsijudge/package.json
          retention-days: 2

      - name: Install dependencies
        working-directory: ./farsijudge
        run: npm install --no-audit --no-fund

      - name: Build site
        working-directory: ./farsijudge
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./farsijudge/dist

      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[]? | select(.name == "github-pages") | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact is visible: $artifact_id"
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt $attempt/12); retrying..."
            sleep 5
          done
          echo "Pages artifact did not become visible in the Actions API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
